];

const RESULTS = [
  {sport:'football', league:'英超 · 第 6 轮', home:'曼联', away:'切尔西', score:'2 : 1'},
  {sport:'esports',  league:'LPL · 季后赛',   home:'JDG',  away:'WBG',   score:'3 : 1'},
  {sport:'badminton',league:'中国公开赛',     home:'郑思维/黄雅琼', away:'渡边勇大/东野有纱', score:'2 : 0'},
];

/* ================= 状态 ================= */
let curDay = 0, curSport = 'all', spoiler = false;
const DAY_LABEL = ['今天','明天','后天'];
const WD = ['日','一','二','三','四','五','六'];

/* ================= 日期条 ================= */
function renderDateStrip(){
  const box = document.getElementById('dateStrip');
  box.innerHTML = '';
  for(let i=0;i<3;i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    const active = i===curDay;
    const b = document.createElement('button');
    b.className = `tab-btn flex-shrink-0 flex flex-col items-center px-5 py-2.5 rounded-xl ${active?'bg-sea-500 text-white shadow-card':'bg-sea-50 text-ink-2 hover:bg-sea-100'}`;
    b.innerHTML = `<span class="text-sm font-bold">${DAY_LABEL[i]}</span>
                   <span class="text-[11px] ${active?'text-sea-50':'text-ink-3'}">${d.getMonth()+1}月${d.getDate()}日 周${WD[d.getDay()]}</span>`;
    b.onclick = ()=>{curDay=i; renderDateStrip(); renderMatches();};
    box.appendChild(b);
  }
}

/* ================= 渠道徽章 ================= */
function chBadges(chs){
  return chs.map(c=>`<span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${c.free?'bg-[#E6F7EF] text-[#1E8A66]':'bg-sea-100 text-sea-700'}">${c.n}${c.free?'·免费':''}</span>`).join('');
}

/* ================= 赛程卡片 ================= */
function timeTag(m){
  const now = new Date();
  if(m.dt < now && m.day===0) return `<span class="text-[10px] font-bold text-ok">进行中</span>`;
  if(m.day===1 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">明晨</span>`;
  if(m.day===2 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">凌晨</span>`;
  return '';
}

function renderMatches(){
  const list = document.getElementById('matchList');
  const ms = MATCHES.filter(m=>m.day===curDay && (curSport==='all'||m.sport===curSport))
                    .sort((a,b)=>a.dt-b.dt);
  if(!ms.length){
    list.innerHTML = `<div class="bg-white rounded-xl shadow-card p-10 text-center text-ink-3 text-sm">这一天没有该项目的比赛，看看别的项目吧</div>`;
    return;
  }
  /* 按联赛分组 */
  const groups = {};
  ms.forEach(m=>{(groups[m.league]=groups[m.league]||[]).push(m);});
  list.innerHTML = Object.entries(groups).map(([league, items])=>`
    <div class="mb-2">
      <div class="flex items-center gap-2 px-1 py-2">
        <span class="text-[11px] font-bold text-ink-3 tracking-wider">${league}</span>
        <div class="flex-1 h-px bg-sea-100"></div>
      </div>
      ${items.map(m=>`
      <div class="card bg-white rounded-xl shadow-card px-4 sm:px-5 py-4 mb-3 cursor-pointer flex items-center gap-3 sm:gap-4" onclick="openModal('${m.id}')">
        <div class="w-14 text-center flex-shrink-0">
          <div class="font-num text-xl font-bold text-ink-1">${m.time}</div>
          ${timeTag(m)}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-[15px] truncate">${m.home} <span class="text-ink-3 font-normal">vs</span> ${m.away}</span>
            ${m.followed?`<svg width="12" height="12" viewBox="0 0 24 24" fill="#F5C542" stroke="#E0B02A" stroke-width="1.5" class="flex-shrink-0"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`:''}
          </div>
          <div class="text-xs text-ink-3 mt-0.5">${SPORT_ICON[m.sport]} ${m.league}</div>
          <div class="hidden sm:flex gap-1.5 mt-2 flex-wrap">${chBadges(m.channels)}</div>
        </div>
        <button onclick="event.stopPropagation();toggleRemind('${m.id}')" title="开赛前 30 分钟提醒"
          class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 transition-colors ${m.remind?'bg-daisy-soft':'bg-sea-50 hover:bg-sea-100'}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${m.remind?'#E0B02A':'#3E9CC6'}" stroke-width="2.2" stroke-linecap="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
      </div>`).join('')}
    </div>`).join('');
}

/* ================= 昨日赛果（防剧透） ================= */
function renderResults(){
  const box = document.getElementById('resultList');
  box.innerHTML = RESULTS.map((r,i)=>`
    <div class="bg-white rounded-xl shadow-card px-5 py-4">
      <div class="text-[11px] font-bold text-ink-3 tracking-wider mb-2">${SPORT_ICON[r.sport]} ${r.league}</div>
      <div class="flex items-center justify-between gap-2">
        <div class="text-sm font-semibold flex-1">${r.home}<br><span class="text-ink-2">${r.away}</span></div>
        <div class="score font-num text-xl font-bold text-sea-700 ${spoiler?'spoiler-blur':''}" data-i="${i}">${spoiler?'0 : 0':r.score}</div>
      </div>
    </div>`).join('');
  if(spoiler){
    box.querySelectorAll('.score').forEach(el=>{
      el.onclick = ()=>{el.textContent = RESULTS[el.dataset.i].score; el.classList.remove('spoiler-blur');};
    });
  }
  document.getElementById('spoilerHint').classList.toggle('hidden', !spoiler);
}

/* ================= 提醒 ================= */
function toggleRemind(id){
  const m = MATCHES.find(x=>x.id===id);
  m.remind = !m.remind;
  toast(m.remind ? `已设置提醒 · ${m.home} vs ${m.away}，开赛前 30 分钟通知你（附直播链接）`
                 : `已取消提醒 · ${m.home} vs ${m.away}`, m.remind);
  renderMatches(); updateFollowCount();
}
function updateFollowCount(){
  const n = MATCHES.filter(m=>m.remind||m.followed).length;
  document.getElementById('followCount').textContent = n;
}

/* ================= 赛前情报卡 ================= */
function openModal(id){
  const m = MATCHES.find(x=>x.id===id);
  document.getElementById('modalPanel').innerHTML = `
    <div class="p-6">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-[11px] font-bold text-ink-3 tracking-wider">${SPORT_ICON[m.sport]} ${m.league}</div>
          <h3 class="text-xl font-bold mt-1">${m.home} <span class="text-ink-3 font-normal">vs</span> ${m.away}</h3>
          <div class="text-sm text-sea-700 font-num font-bold mt-1">${DAY_LABEL[m.day]} ${m.time} 开赛</div>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-sea-50 hover:bg-sea-100 flex items-center justify-center text-ink-2 flex-shrink-0">✕</button>
      </div>
      <div class="flex gap-1.5 mt-4 flex-wrap">${chBadges(m.channels)}</div>

      <div class="mt-5 bg-sea-50 rounded-xl p-4">
        <div class="text-xs font-bold text-sea-700 mb-2">赛前情报卡</div>
        ${m.info.form.length?`<div class="text-sm text-ink-2 space-y-1">${m.info.form.map(f=>`<div>· ${f}</div>`).join('')}</div>`:''}
        <div class="text-sm text-ink-2 mt-1">· 交锋记录：${m.info.h2h}</div>
        <div class="text-sm text-ink-1 mt-2 leading-relaxed">${m.info.note}</div>
      </div>

      <div class="flex gap-3 mt-5">
        <button onclick="toggleRemind('${m.id}');closeModal()"
          class="flex-1 ${m.remind?'bg-sea-100 text-sea-700':'bg-daisy hover:bg-daisy-hover text-[#5C4400]'} font-semibold text-sm py-3 rounded-full transition-colors">
          ${m.remind?'已设置提醒 · 点击取消':'开赛前 30 分钟提醒我'}
        </button>
        <a href="#" onclick="event.preventDefault();toast('演示环境：实际产品将跳转到直播平台',true)"
          class="flex-1 bg-sea-500 hover:bg-sea-600 text-white font-semibold text-sm py-3 rounded-full text-center transition-colors">去观赛</a>
      </div>
    </div>`;
  const md = document.getElementById('modal');
  md.classList.remove('hidden'); md.classList.add('flex');
  document.body.style.overflow='hidden';
}
function closeModal(){
  const md = document.getElementById('modal');
  md.classList.add('hidden'); md.classList.remove('flex');
  document.body.style.overflow='';
}

/* ================= Toast ================= */
function toast(msg, good=true){
  const t = document.createElement('div');
  t.className = `toast flex items-center gap-2 bg-deep-900 text-white text-sm px-5 py-3 rounded-full shadow-pop`;
  t.innerHTML = `<span class="w-2 h-2 rounded-full ${good?'bg-daisy':'bg-sea-300'}"></span>${msg}`;
  document.getElementById('toastBox').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320);},2600);
}

/* ================= 最近一场倒计时 ================= */
function tick(){
  const now = new Date();
  const next = MATCHES.filter(m=>m.dt>now).sort((a,b)=>a.dt-b.dt)[0];
  const tEl = document.getElementById('cdTime'), nEl = document.getElementById('cdTitle');
  if(!next){nEl.textContent='近期赛事已播完';tEl.textContent='--:--:--';return;}
  nEl.textContent = `最近一场 · ${next.home} vs ${next.away}`;
  let s = Math.max(0, Math.floor((next.dt-now)/1000));
  const h = String(Math.floor(s/3600)).padStart(2,'0'), m2 = String(Math.floor(s%3600/60)).padStart(2,'0'), ss = String(s%60).padStart(2,'0');
  tEl.textContent = `${h}:${m2}:${ss}`;
}

/* ================= 项目筛选 ================= */
document.querySelectorAll('.sport-tab').forEach(b=>{
  b.onclick = ()=>{
    curSport = b.dataset.sport;
    document.querySelectorAll('.sport-tab').forEach(x=>{
      const on = x===b;
      x.className = `tab-btn sport-tab whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold ${on?'bg-deep-900 text-white':'bg-sea-50 text-sea-700 hover:bg-sea-100'}`;
    });
    renderMatches();
  };
});

/* ================= 防剧透开关 ================= */
document.getElementById('spoilerSwitch').onclick = ()=>{
  spoiler = !spoiler;
  const sw = document.getElementById('spoilerSwitch'), knob = document.getElementById('spoilerKnob');
  sw.className = `w-10 h-5 rounded-full relative transition-colors cursor-pointer ${spoiler?'bg-daisy':'bg-sea-200'}`;
  knob.style.left = spoiler ? '22px' : '2px';
  toast(spoiler?'防剧透已开启：比分默认隐藏，点击单独查看':'防剧透已关闭', spoiler);
  renderResults();
};
document.getElementById('followBtn').onclick = ()=>{
  const fs = MATCHES.filter(m=>m.remind||m.followed);
  if(!fs.length) return toast('还没有关注任何比赛或设置提醒', false);
  toast(`已关注 ${fs.length} 场：` + fs.slice(0,3).map(m=>`${m.home} vs ${m.away}`).join('、') + (fs.length>3?' 等':''), true);
};

/* ================= 初始化 ================= */
renderDateStrip(); renderMatches(); renderResults(); updateFollowCount(); tick();
setInterval(tick, 1000);
</script>
</body>
</html>
