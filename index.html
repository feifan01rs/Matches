<script>
/* ================= 数据层（真实接口 + mock 回退） ================= */
const SPORT_NAME = {football:'足球', esports:'电竞', badminton:'羽毛球'};
const SPORT_ICON = {football:'⚽', esports:'🎮', badminton:'🏸'};
/* 电竞子项目图标（真实数据里 game 字段会带具体游戏）
   ⚠️ CS2 已按需求从数据源排除（见服务端 PS_GAMES），前端再做一道兜底过滤 */
const GAME_ICON = {lol:'🟦', valorant:'🎯', dota2:'🛡️'};
const GAME_NAME = {lol:'英雄联盟', valorant:'无畏契约', dota2:'DOTA2'};
const BLOCKED_GAMES = ['csgo'];              // 不展示的电竞项目

/* 时间跨度：未来 15 天预告（今天 + 15 天 = 16 个日期）+ 过去 15 天赛果 */
const LOOKAHEAD_DAYS = 15;
const DAY_LABEL = ['今天','明天','后天'];
const WD = ['日','一','二','三','四','五','六'];

/* 接口地址（按场景自动判定，也可手动指定 window.__API_BASE__ 覆盖）：
   1. 手动指定 window.__API_BASE__ 时以它为准（后端在别的域名时用）
   2. 双击文件打开（file://）→ 指向本地代理 http://localhost:8787（需先跑 server.js）
   3. http / https 打开（本地 8787 或 Vercel 线上）→ 走【同域相对路径】/api/matches，零配置
   拉取失败时会自动回退内置 demo 数据，页面不会白屏 */
const API_BASE = window.__API_BASE__
  ?? (location.protocol === 'file:' ? 'http://localhost:8787' : '');
// http(s) 场景一律走真实接口（相对路径即为同域 /api/matches）；失败时由 loadMatches 内部回退 mock
const USE_MOCK = false;

function mk(day, hh, mm, sport, league, home, away, channels, info, followed=false){
  const d = new Date(); d.setDate(d.getDate()+day); d.setHours(hh, mm, 0, 0);
  return {id: `${sport}-${day}-${hh}${mm}-${home}`, day, dt:d, time:`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`,
          sport, league, home, away, channels, info, followed, remind:false};
}

/* ============ 接口数据归一化 ============ */
/* 把服务端返回的扁平结构，转成页面渲染需要的结构：
   utcDate(ISO) → dt(Date 本地) / day(0..2 相对天) / time(HH:mm 本地) */
function normalize(raw) {
  const today = new Date(); today.setHours(0,0,0,0);
  return raw.map(m => {
    const dt = new Date(m.utcDate);
    const dayKey = new Date(dt); dayKey.setHours(0,0,0,0);
    const day = Math.round((dayKey - today) / 86400000);   // 0=今天 1=明天 2=后天
    return {
      id: m.id,
      day,
      dateKey: `${dayKey.getFullYear()}-${String(dayKey.getMonth()+1).padStart(2,'0')}-${String(dayKey.getDate()).padStart(2,'0')}`,
      dt,
      time: `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`,
      sport: m.sport,
      league: m.league,
      home: m.home,
      away: m.away,
      channels: m.channels || [],
      bo: m.bo || null,
      game: m.game || null,                                 // 电竞子项目 lol/csgo/valorant/dota2
      top: m.top || 0,                                      // 是否知名赛事
      score: m.score || null,
      status: m.status || null,
      info: m.info || null,                                  // 免费数据源无情报，Modal 会优雅降级
      followed: false, remind: false,
    };
  }).filter(m => m.day >= 0 && m.day <= LOOKAHEAD_DAYS         // 今天 ~ 未来 15 天
              && !BLOCKED_GAMES.includes(m.game));             // CS2 不展示
}

/* 赛果归一化：半个月的赛果要按日期分组展示，所以这里把「日期键 / 日期标签 / 时间戳」一次算好 */
function normalizeResults(raw) {
  const today = new Date(); today.setHours(0,0,0,0);
  return raw
    .filter(r => r.utcDate && !BLOCKED_GAMES.includes(r.game))
    .map(r => {
      const dt = new Date(r.utcDate);
      const dk = new Date(dt); dk.setHours(0,0,0,0);
      const diff = Math.round((dk - today) / 86400000);
      const dayLabel = diff === 0 ? '今天' : diff === -1 ? '昨天'
                     : diff === -2 ? '前天' : `${dt.getMonth()+1}月${dt.getDate()}日`;
      const hhmm = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return {
        id: r.id,
        sport: r.sport,
        game: r.game || null,
        league: r.league || '赛事',
        home: r.home, away: r.away,
        score: r.score || '—',
        dateKey: `${dk.getFullYear()}-${String(dk.getMonth()+1).padStart(2,'0')}-${String(dk.getDate()).padStart(2,'0')}`,
        dayNum: `${dt.getMonth()+1}月${dt.getDate()}日`,

        diff,
        time: hhmm,
        ts: dt.getTime(),
        when: `${dayLabel} ${hhmm}`,     // 兼容旧字段（Modal / 其他引用）
      };
    })

}

let MATCHES = [];          // 由接口填充；拉取失败则回退 mock
let DATA_SOURCE = 'mock';

async function loadMatches() {
  if (USE_MOCK) { MATCHES = MOCK_MATCHES; RESULTS = MOCK_RESULTS; DATA_SOURCE = 'mock'; return; }
  const box = document.getElementById('matchList');
  box.innerHTML = `<div class="bg-white rounded-xl shadow-card p-10 text-center text-ink-3 text-sm">
      <span class="inline-block w-4 h-4 border-2 border-sea-300 border-t-sea-600 rounded-full animate-spin align-middle mr-2"></span>正在加载最新赛程…
    </div>`;
  try {
    const res = await fetch(`${API_BASE}/api/matches`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { matches = [], results = [] } = await res.json();
    MATCHES = normalize(matches);
    if (results.length) RESULTS = normalizeResults(results);   // 半个月赛果一并通过接口带回
    DATA_SOURCE = 'live';
    if (!MATCHES.length) throw new Error('接口返回 0 场赛程');
  } catch (e) {
    console.warn('[loadMatches] 接口失败，回退 mock：', e.message);
    MATCHES = MOCK_MATCHES; RESULTS = MOCK_RESULTS; DATA_SOURCE = 'mock';
    toast('实时数据获取失败，已切换到演示数据', false);
  }
}

/* ================= 日期条（今天 + 未来 15 天，共 16 个日期） ================= */
function renderDateStrip(){
  const box = document.getElementById('dateStrip');
  box.innerHTML = '';
  // 先统计每天有多少场，直接标在日期上 —— 15 天跨度里用户要一眼看出哪天值得看
  const cntByDay = {};
  MATCHES.forEach(m => { cntByDay[m.day] = (cntByDay[m.day] || 0) + 1; });

  for(let i=0;i<=LOOKAHEAD_DAYS;i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    const cnt = cntByDay[i] || 0;
    const active = i===curDay;
    const label = DAY_LABEL[i] ?? `周${WD[d.getDay()]}`;
    const b = document.createElement('button');
    b.className = `tab-btn flex-shrink-0 flex flex-col items-center px-3.5 py-2 rounded-xl min-w-[62px] ${active?'bg-sea-500 text-white shadow-card':'bg-sea-50 text-ink-2 hover:bg-sea-100'}`;
    b.innerHTML = `<span class="text-sm font-bold whitespace-nowrap">${label}</span>
                   <span class="text-[11px] ${active?'text-sea-50':'text-ink-3'}">${d.getMonth()+1}/${d.getDate()}</span>
                   <span class="text-[10px] leading-4 ${cnt?(active?'text-white':'text-sea-600 font-semibold'):(active?'text-sea-100/70':'text-ink-3 opacity-40')}">${cnt?`${cnt} 场`:'—'}</span>`;
    b.onclick = ()=>{ curDay=i; renderDateStrip(); renderMatches(); };
    box.appendChild(b);
  }

  // 选中日期滚出可视区时把它拉回来（只滚动容器本身，不影响页面滚动位置）
  const act = box.children[curDay];
  if(act && box.scrollWidth > box.clientWidth){
    box.scrollLeft = Math.max(0, act.offsetLeft - 8);
  }
  // 离开今天时给出「回到今天」快捷入口（16 个日期滚到后面就找不到今天了）
  const bt = document.getElementById('backToday');
  if(bt) bt.classList.toggle('hidden', curDay === 0);
}

  if(m.day===1 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">明晨</span>`;
  if(m.day>1 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">凌晨</span>`;
  return '';
}

/* ================= 赛果回顾（防剧透） ================= */
/* 半个月的赛果有两三百场，平铺会把页面撑爆，所以：
   按日期倒序分组 → 每组默认只露 6 场 → 组内可展开 → 顶部按项目筛选 */
const RESULT_PREVIEW = 6;

function resultCard(r){
  const icon = r.game ? (GAME_ICON[r.game] || SPORT_ICON[r.sport]) : SPORT_ICON[r.sport];
  return `
    <div class="bg-white rounded-xl shadow-card px-5 py-4">
      <div class="text-[11px] font-bold text-ink-3 tracking-wider mb-2 truncate">${icon} ${r.league}</div>
      <div class="flex items-center justify-between gap-2">
        <div class="text-sm font-semibold flex-1 min-w-0">${r.home}<br><span class="text-ink-2">${r.away}</span></div>
        <div class="score font-num text-xl font-bold text-sea-700 ${spoiler?'spoiler-blur':''}" data-score="${r.score}">${spoiler?'0 : 0':r.score}</div>
      </div>
      <div class="text-[11px] text-ink-3 mt-2 font-num">${r.time}</div>
    </div>`;
}

function renderResults(){
  const box = document.getElementById('resultList');
  const hint = document.getElementById('resultHint');
  const list = RESULTS.filter(r => resSport==='all' || r.sport===resSport);

  if(!list.length){
    box.innerHTML = `<div class="bg-white rounded-xl shadow-card px-5 py-10 text-center text-ink-3 text-sm col-span-full">最近半个月没有已结束的比赛</div>`;
    if(hint) hint.textContent = '';
    document.getElementById('spoilerHint').classList.toggle('hidden', !spoiler);
    return;
  }

  // 按自然日分组：RESULTS 本身已按时间倒序，Map 的插入顺序即「日期倒序」
  const groups = new Map();
  for(const r of list){
    if(!groups.has(r.dateKey)) groups.set(r.dateKey, []);
    groups.get(r.dateKey).push(r);
  }

  box.innerHTML = [...groups.entries()].map(([key, items])=>{
    const head = items[0];
    const opened = expandedDays.has(key);
    const shown = opened ? items : items.slice(0, RESULT_PREVIEW);
    const rest = items.length - shown.length;
    const dayTag = head.diff===0 ? '<span class="text-[10px] font-bold text-ok">今天</span>'
                 : head.diff===-1 ? '<span class="text-[10px] font-bold text-sea-600">昨天</span>' : '';
    return `
    <div class="col-span-full">
      <div class="flex items-center gap-2.5 pt-2 pb-2">
        <span class="text-xs font-bold text-ink-1 font-num">${head.dayNum}</span>
        <span class="text-[11px] text-ink-3">周${head.wd}</span>
        ${dayTag}
        <div class="flex-1 h-px bg-sea-100"></div>
        <span class="text-[11px] text-ink-3 font-num">${items.length} 场</span>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${shown.map(resultCard).join('')}
        ${rest>0 ? `<button onclick="expandResults('${key}')" class="rounded-xl border border-dashed border-sea-200 text-sea-700 text-sm font-semibold py-4 px-4 hover:bg-sea-50 transition-colors">展开当日全部 ${items.length} 场<svg class="inline ml-1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" data-page-node-id="expChev"><path d="M6 9l6 6 6-6"/></svg></button>` : ''}
        ${opened && items.length>RESULT_PREVIEW ? `<button onclick="collapseResults('${key}')" class="rounded-xl text-ink-3 text-xs font-semibold py-4 hover:text-ink-1 transition-colors">收起</button>` : ''}
      </div>
    </div>`;
  }).join('');

  if(hint) hint.textContent = `${groups.size} 天 · ${list.length} 场`;

  // 防剧透：比分区默认打码，点一下单独揭示（比分直接存在 data 属性里，不依赖数组下标）
  if(spoiler){
    box.querySelectorAll('.score').forEach(el=>{
      el.onclick = ()=>{ el.textContent = el.dataset.score; el.classList.remove('spoiler-blur'); };
    });
  }
  document.getElementById('spoilerHint').classList.toggle('hidden', !spoiler);
}

/* 赛果按天折叠：默认每组只露 6 场，避免 15 天 × N 场把页面拉成无底洞 */

function collapseResults(key){ expandedDays.delete(key); renderResults(); }

        </button>
        <a href="#" onclick="event.preventDefault();toast('实际产品将跳转到直播平台（需接入各家深链）',true)"
          class="flex-1 bg-sea-500 hover:bg-sea-600 text-white font-semibold text-sm py-3 rounded-full text-center transition-colors">去观赛</a>
      </div>
    </div>`;
  const md = document.getElementById('modal');
  md.classList.remove('hidden'); md.classList.add('flex');
  document.body.style.overflow='hidden';
}
function closeModal(){
  const md = document.getElementById('modal');
  md.classList.add('hidden'); md.classList.remove('flex');
  document.body.style.overflow='';
}

/* ================= Toast ================= */
function toast(msg, good=true){
  const t = document.createElement('div');
  t.className = `toast flex items-center gap-2 bg-deep-900 text-white text-sm px-5 py-3 rounded-full shadow-pop`;
  t.innerHTML = `<span class="w-2 h-2 rounded-full ${good?'bg-daisy':'bg-sea-300'}"></span>${msg}`;
  document.getElementById('toastBox').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320);},2600);
}

/* ================= 最近一场倒计时 ================= */
function tick(){
  const now = new Date();
  const next = MATCHES.filter(m=>m.dt>now).sort((a,b)=>a.dt-b.dt)[0];
  const tEl = document.getElementById('cdTime'), nEl = document.getElementById('cdTitle');
  if(!next){nEl.textContent='近期赛事已播完';tEl.textContent='--:--:--';return;}
  nEl.textContent = `最近一场 · ${next.home} vs ${next.away}`;
  let s = Math.max(0, Math.floor((next.dt-now)/1000));
  const h = String(Math.floor(s/3600)).padStart(2,'0'), m2 = String(Math.floor(s%3600/60)).padStart(2,'0'), ss = String(s%60).padStart(2,'0');
  tEl.textContent = `${h}:${m2}:${ss}`;
}

/* ================= 项目筛选 ================= */
document.querySelectorAll('.sport-tab').forEach(b=>{
  b.onclick = ()=>{
    curSport = b.dataset.sport;
    document.querySelectorAll('.sport-tab').forEach(x=>{
      const on = x===b;
      x.className = `tab-btn sport-tab whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold ${on?'bg-deep-900 text-white':'bg-sea-50 text-sea-700 hover:bg-sea-100'}`;
    });
    renderMatches();
  };
});

/* ================= 赛果项目筛选 ================= */
document.querySelectorAll('.rsport-tab').forEach(b=>{
  b.onclick = ()=>{
    resSport = b.dataset.rsport;
    document.querySelectorAll('.rsport-tab').forEach(x=>{
      const on = x===b;
      x.className = `tab-btn rsport-tab px-3 py-1.5 rounded-full text-xs font-semibold ${on?'bg-deep-900 text-white':'bg-sea-50 text-sea-700 hover:bg-sea-100'}`;
    });
    expandedDays.clear();                 // 换了筛选条件就回到默认折叠态
    renderResults();
  };
});

/* ================= 回到今天 ================= */
document.getElementById('backToday').onclick = ()=>{
  curDay = 0;
  renderDateStrip(); renderMatches();
  document.getElementById('dateStrip').scrollIntoView({behavior:'smooth', block:'nearest'});
};

/* ================= 防剧透开关 ================= */
document.getElementById('spoilerSwitch').onclick = ()=>{
  spoiler = !spoiler;
  const sw = document.getElementById('spoilerSwitch'), knob = document.getElementById('spoilerKnob');
  sw.className = `w-10 h-5 rounded-full relative transition-colors cursor-pointer ${spoiler?'bg-daisy':'bg-sea-200'}`;
  knob.style.left = spoiler ? '22px' : '2px';
  toast(spoiler?'防剧透已开启：比分默认隐藏，点击单独查看':'防剧透已关闭', spoiler);
  renderResults();
};
document.getElementById('followBtn').onclick = ()=>{
  const fs = MATCHES.filter(m=>m.remind||m.followed);
  if(!fs.length) return toast('还没有关注任何比赛或设置提醒', false);
  toast(`已关注 ${fs.length} 场：` + fs.slice(0,3).map(m=>`${m.home} vs ${m.away}`).join('、') + (fs.length>3?' 等':''), true);
};

/* ================= 初始化 ================= */
(async function init(){
  renderDateStrip();
  renderResults();                       // 先用示例赛果占位，避免首屏空白
  document.getElementById('matchList').innerHTML = '';
  await loadMatches();                   // 先取数（赛程 + 半个月赛果一并带回），再渲染
  labelMatches();
  renderDateStrip();                     // 拿到真实数据后刷新日期条上的「每天几场」
  const badge = document.getElementById('srcBadge');
  if (badge) {
    badge.textContent = DATA_SOURCE === 'live'
      ? `实时数据 · 未来 15 天 ${MATCHES.length} 场 · 赛果 ${RESULTS.length} 场 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 更新`
      : `演示数据（未接入接口）· ${MATCHES.length} 场`;
    badge.className = `text-[11px] font-semibold px-2.5 py-1 rounded-full backdrop-blur ${DATA_SOURCE==='live'?'bg-white/70 text-deep-800':'bg-daisy-soft text-[#7A5B00]'}`;
  }
  renderResults();                       // 接口拿到赛果就重绘（拿不到则保持示例）
  renderMatches(); updateFollowCount(); tick();
  setInterval(tick, 1000);
  // 页面可见时自动刷新赛程（切回标签页不会看到过期数据）
  document.addEventListener('visibilitychange', async ()=>{
    if(!document.hidden && !USE_MOCK){
      await loadMatches(); labelMatches(); renderDateStrip(); renderMatches(); renderResults(); updateFollowCount();
    }
  });
})();
</script>
