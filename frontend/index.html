<script>
/* ================= 数据层（全部来自后端，后端再来自数据库） ================= */
const SPORT_NAME = {football:'足球', esports:'电竞', badminton:'羽毛球'};
const SPORT_ICON = {football:'⚽', esports:'🎮', badminton:'🏸'};
/* 电竞子项目图标（真实数据里 game 字段会带具体游戏）
   ⚠️ CS2 已按需求从数据源排除（见服务端 PS_GAMES），前端再做一道兜底过滤 */
const GAME_ICON = {lol:'🟦', valorant:'🎯', dota2:'🛡️'};
const GAME_NAME = {lol:'英雄联盟', valorant:'无畏契约', dota2:'DOTA2'};
const BLOCKED_GAMES = ['csgo'];              // 不展示的电竞项目

/* 时间跨度：未来 15 天预告（今天 + 15 天 = 16 个日期）+ 过去 15 天赛果 */
const LOOKAHEAD_DAYS = 15;
const DAY_LABEL = ['今天','明天','后天'];
const WD = ['日','一','二','三','四','五','六'];
/* 羽毛球一天动辄上百场，页面上每天只显示前 N 场（抓取照旧，只是少显示） */
const BADMINTON_PER_DAY = 10;

/* 接口地址（按场景自动判定，也可手动指定 window.__API_BASE__ 覆盖）：
   1. 手动指定 window.__API_BASE__ 时以它为准（后端在别的域名时用）
   2. 双击文件打开（file://）→ 指向本机后端 http://localhost:8787（需先跑 server.js）
   3. http / https 打开（就是本机后端 8787）→ 走【同域相对路径】/api/matches，零配置
   数据一律来自后端（后端再来自数据库）；读不到就如实显示，不再用假数据顶上 */
const API_BASE = window.__API_BASE__
  ?? (location.protocol === 'file:' ? 'http://localhost:8787' : '');

/* ============ 接口数据归一化 ============ */
/* 把服务端返回的扁平结构，转成页面渲染需要的结构：
   utcDate(ISO) → dt(Date 本地) / day(0..2 相对天) / time(HH:mm 本地) */
function normalize(raw) {
  const today = new Date(); today.setHours(0,0,0,0);
  return raw.map(m => {
    const dt = new Date(m.utcDate);
    const dayKey = new Date(dt); dayKey.setHours(0,0,0,0);
    const day = Math.round((dayKey - today) / 86400000);   // 0=今天 1=明天 2=后天
    return {
      id: m.id,
      day,
      dateKey: `${dayKey.getFullYear()}-${String(dayKey.getMonth()+1).padStart(2,'0')}-${String(dayKey.getDate()).padStart(2,'0')}`,
      dt,
      // 羽毛球的时间上游只给「场馆当地时刻」，后端会传 timeText='待定'；
      // 有就用它，避免把不带时区的时间当北京时间显示成假时刻
      time: m.timeText || `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`,
      sport: m.sport,
      league: m.league,
      home: m.home,
      away: m.away || null,                                 // 羽毛球「抽签未出」的赛事级卡片没有对手
      pending: !!m.pending,                                 // 同上：渲染成单行赛事名，不显示 "vs"
      stage: m.stage || null,                               // 羽毛球用来放地点 / 轮次
      channels: m.channels || [],
      bo: m.bo || null,
      game: m.game || null,                                 // 电竞子项目 lol/csgo/valorant/dota2
      top: m.top || 0,                                      // 是否知名赛事
      score: m.score || null,
      status: m.status || null,
      info: m.info || null,                                  // 免费数据源无情报，Modal 会优雅降级
      followed: false, remind: false,
    };
  }).filter(m => m.day >= 0 && m.day <= LOOKAHEAD_DAYS         // 今天 ~ 未来 15 天
              && !BLOCKED_GAMES.includes(m.game));             // CS2 不展示
}

/* 赛果归一化：半个月的赛果要按日期分组展示，所以这里把「日期键 / 日期标签 / 时间戳」一次算好 */
function normalizeResults(raw) {
  const today = new Date(); today.setHours(0,0,0,0);
  return raw
    .filter(r => r.utcDate && !BLOCKED_GAMES.includes(r.game))
    .map(r => {
      const dt = new Date(r.utcDate);
      const dk = new Date(dt); dk.setHours(0,0,0,0);
      const diff = Math.round((dk - today) / 86400000);
      const dayLabel = diff === 0 ? '今天' : diff === -1 ? '昨天'
                     : diff === -2 ? '前天' : `${dt.getMonth()+1}月${dt.getDate()}日`;
      const hhmm = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return {
        id: r.id,
        sport: r.sport,
        game: r.game || null,
        league: r.league || '赛事',
        home: r.home, away: r.away,
        score: r.score || '—',
        dateKey: `${dk.getFullYear()}-${String(dk.getMonth()+1).padStart(2,'0')}-${String(dk.getDate()).padStart(2,'0')}`,
        dayNum: `${dt.getMonth()+1}月${dt.getDate()}日`,
        wd: WD[dt.getDay()],
        diff,
        time: r.timeText || hhmm,   // 羽毛球赛果上游只给到「天」，后端会传 timeText='—'
        ts: dt.getTime(),
        when: `${dayLabel} ${hhmm}`,     // 兼容旧字段（Modal / 其他引用）
      };
    })
    .sort((a, b) => b.ts - a.ts);        // 全局按结束时间倒序：最新的赛果排最上
}

/* ============ 从后端读数据（后端再从数据库读） ============ */
let MATCHES = [];
/* 最近一次请求的结果 —— 用于把失败原因显示出来（0 = 请求没发出去 / 网络层失败） */
let LAST_STATUS = 0, LAST_ERR = null;
/* 后端自报的版本号（payload.build），显示在数据来源徽章上，方便确认跑的是哪一版 */
let API_BUILD = '';

async function loadMatches() {
  const box = document.getElementById('matchList');
  box.innerHTML = `<div class="bg-white rounded-xl shadow-card p-10 text-center text-ink-3 text-sm">
      <span class="inline-block w-4 h-4 border-2 border-sea-300 border-t-sea-600 rounded-full animate-spin align-middle mr-2"></span>正在加载最新赛程…
    </div>`;
  LAST_STATUS = 0; LAST_ERR = null;
  try {
    const res = await fetch(`${API_BASE}/api/matches`, { cache: 'no-store' });
    LAST_STATUS = res.status;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { matches = [], results = [], build = '' } = await res.json();
    API_BUILD = build;
    MATCHES = normalize(matches);
    RESULTS = normalizeResults(results);       // 赛果和后端一起返回
  } catch (e) {
    LAST_ERR = e.message;
    MATCHES = [];
    RESULTS = [];
    console.warn('[loadMatches] 读后端失败：', e.message, '· HTTP', LAST_STATUS);
  }
}

/* ============ 从后端读取「我的提醒」（存在数据库里，刷新不丢） ============ */
async function loadFollows(){
  try {
    const res = await fetch(`${API_BASE}/api/follows`, { cache: 'no-store' });
    if (!res.ok) return;
    const { follows = [] } = await res.json();
    const reminded = new Set(follows.filter(f => f.reminded).map(f => f.matchId));
    MATCHES.forEach(m => { m.remind = reminded.has(m.id); });
  } catch {
    /* 后端没连上就保持默认（没提醒），页面照常显示 */
  }
}

/* 把一条提醒状态发给后端保存（打开 / 关闭） */
async function saveFollow(id, reminded){
  try {
    await fetch(`${API_BASE}/api/follows`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matchId: id, reminded }),
    });
  } catch {
    toast('提醒没保存成功（后端没连上）', false);
  }
}

let RESULTS = [];

/* ================= 状态 ================= */
let curDay = 0, curSport = 'all', spoiler = false;
let resSport = 'all';                  // 赛果区项目筛选（全部/足球/电竞）
const expandedDays = new Set();        // 已「展开全部」的赛果日期（dateKey）

/* 给每场比赛打上「相对日」标签，供 Modal 显示（超出今天/明天/后天时退化为具体日期） */
function labelMatches(){
  MATCHES.forEach(m => {
    m.dateLabel = DAY_LABEL[m.day] ?? `${m.dt.getMonth()+1}月${m.dt.getDate()}日 周${WD[m.dt.getDay()]}`;
  });
}

/* ================= 日期条（今天 + 未来 15 天，共 16 个日期） ================= */
function renderDateStrip(){
  const box = document.getElementById('dateStrip');
  box.innerHTML = '';
  // 先统计每天有多少场，直接标在日期上 —— 15 天跨度里用户要一眼看出哪天值得看。
  // ⚠️ 羽毛球超过每日上限的部分不会显示，所以这里也按上限算，
  //    免得日期条写着「155 场」、点进去只有 10 场。
  const stat = {};
  MATCHES.forEach(m => {
    const s = stat[m.day] || (stat[m.day] = { total: 0, badminton: 0 });
    s.total++;
    if (m.sport === 'badminton') s.badminton++;
  });
  const shownCount = (i) => {
    const s = stat[i];
    return s ? (s.total - s.badminton) + Math.min(s.badminton, BADMINTON_PER_DAY) : 0;
  };

  for(let i=0;i<=LOOKAHEAD_DAYS;i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    const cnt = shownCount(i);
    const active = i===curDay;
    const label = DAY_LABEL[i] ?? `周${WD[d.getDay()]}`;
    const b = document.createElement('button');
    b.className = `tab-btn flex-shrink-0 flex flex-col items-center px-3.5 py-2 rounded-xl min-w-[62px] ${active?'bg-sea-500 text-white shadow-card':'bg-sea-50 text-ink-2 hover:bg-sea-100'}`;
    b.innerHTML = `<span class="text-sm font-bold whitespace-nowrap">${label}</span>
                   <span class="text-[11px] ${active?'text-sea-50':'text-ink-3'}">${d.getMonth()+1}/${d.getDate()}</span>
                   <span class="text-[10px] leading-4 ${cnt?(active?'text-white':'text-sea-600 font-semibold'):(active?'text-sea-100/70':'text-ink-3 opacity-40')}">${cnt?`${cnt} 场`:'—'}</span>`;
    b.onclick = ()=>{ curDay=i; renderDateStrip(); renderMatches(); };
    box.appendChild(b);
  }

  // 选中日期滚出可视区时把它拉回来（只滚动容器本身，不影响页面滚动位置）
  const act = box.children[curDay];
  if(act && box.scrollWidth > box.clientWidth){
    box.scrollLeft = Math.max(0, act.offsetLeft - 8);
  }
  // 离开今天时给出「回到今天」快捷入口（16 个日期滚到后面就找不到今天了）
  const bt = document.getElementById('backToday');
  if(bt) bt.classList.toggle('hidden', curDay === 0);
}

/* ================= 渠道徽章（有网址的，点一下直接跳过去） ================= */
function chBadges(chs){
  return chs.map(c=>{
    const cls = `text-[11px] font-semibold px-2.5 py-1 rounded-full ${c.free?'bg-[#E6F7EF] text-[#1E8A66]':'bg-sea-100 text-sea-700'}`;
    const label = `${c.n}${c.free?'·免费':''}`;
    return c.url
      ? `<a href="${c.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="${cls} hover:underline">${label} ↗</a>`
      : `<span class="${cls}">${label}</span>`;
  }).join('');
}

/* 对阵文案：羽毛球「抽签未出」的赛事级卡片没有对手，只显示赛事名，不显示 "vs" */
function vsText(m){ return m.away ? `${m.home} <span class="text-ink-3 font-normal">vs</span> ${m.away}` : m.home; }
function vsPlain(m){ return m.away ? `${m.home} vs ${m.away}` : m.home; }

/* ================= 赛程卡片 ================= */
function timeTag(m){
  // 羽毛球的开赛时刻上游只给到「天」（time='待定'/'全天'），无从判断是否正在进行
  if(m.time === '待定' || m.time === '全天') return '';
  const now = new Date();
  if(m.day===0 && m.dt < now) return `<span class="text-[10px] font-bold text-ok">进行中</span>`;
  if(m.day===1 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">明晨</span>`;
  if(m.day>1 && m.dt.getHours()<8) return `<span class="text-[10px] font-bold text-warn">凌晨</span>`;
  return '';
}

function renderMatches(){
  const list = document.getElementById('matchList');
  let ms = MATCHES.filter(m=>m.day===curDay && (curSport==='all'||m.sport===curSport))
                  .sort((a,b)=>a.dt-b.dt);

  // 羽毛球当天超过上限时，只留开赛最早的前 N 场，其余不渲染
  const badminton = ms.filter(m=>m.sport==='badminton');
  let badmintonHidden = 0;
  if(badminton.length > BADMINTON_PER_DAY){
    const keep = new Set(badminton.slice(0, BADMINTON_PER_DAY).map(m=>m.id));
    ms = ms.filter(m=>m.sport!=='badminton' || keep.has(m.id));
    badmintonHidden = badminton.length - BADMINTON_PER_DAY;
  }

  if(!ms.length){
    list.innerHTML = `<div class="bg-white rounded-xl shadow-card p-10 text-center text-ink-3 text-sm">这一天没有该项目的比赛，看看别的项目吧</div>`;
    return;
  }
  /* 按联赛分组 */
  const groups = {};
  ms.forEach(m=>{(groups[m.league]=groups[m.league]||[]).push(m);});
  list.innerHTML = Object.entries(groups).map(([league, items])=>`
    <div class="mb-2">
      <div class="flex items-center gap-2 px-1 py-2">
        <span class="text-[11px] font-bold text-ink-3 tracking-wider">${league}</span>
        <div class="flex-1 h-px bg-sea-100"></div>
      </div>
      ${items.map(m=>`
      <div class="card bg-white rounded-xl shadow-card px-4 sm:px-5 py-4 mb-3 cursor-pointer flex items-center gap-3 sm:gap-4" onclick="openModal('${m.id}')">
        <div class="w-14 text-center flex-shrink-0">
          <div class="font-num text-xl font-bold text-ink-1">${m.time}</div>
          ${timeTag(m)}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-[15px] truncate">${vsText(m)}</span>
            ${m.followed?`<svg width="12" height="12" viewBox="0 0 24 24" fill="#F5C542" stroke="#E0B02A" stroke-width="1.5" class="flex-shrink-0"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`:''}
          </div>
          <div class="text-xs text-ink-3 mt-0.5">${GAME_ICON[m.game] || SPORT_ICON[m.sport]} ${m.league}${m.bo?` <span class="text-sea-600 font-semibold">· ${m.bo}</span>`:''}${m.pending && m.stage?` <span class="text-ink-3">· ${m.stage}</span>`:''}</div>
          <div class="hidden sm:flex gap-1.5 mt-2 flex-wrap">${chBadges(m.channels)}</div>
        </div>
        <button onclick="event.stopPropagation();toggleRemind('${m.id}')" title="开赛前 30 分钟提醒"
          class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 transition-colors ${m.remind?'bg-daisy-soft':'bg-sea-50 hover:bg-sea-100'}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${m.remind?'#E0B02A':'#3E9CC6'}" stroke-width="2.2" stroke-linecap="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
      </div>`).join('')}
    </div>`).join('')
    + (badmintonHidden ? `<div class="text-center text-xs text-ink-3 py-2">当天还有 ${badmintonHidden} 场羽毛球未显示</div>` : '');
}

/* ================= 赛果回顾（防剧透） ================= */
/* 半个月的赛果有两三百场，平铺会把页面撑爆，所以：
   按日期倒序分组 → 每组默认只露 6 场 → 组内可展开 → 顶部按项目筛选 */
const RESULT_PREVIEW = 6;

function resultCard(r){
  const icon = r.game ? (GAME_ICON[r.game] || SPORT_ICON[r.sport]) : SPORT_ICON[r.sport];
  return `
    <div class="bg-white rounded-xl shadow-card px-5 py-4">
      <div class="text-[11px] font-bold text-ink-3 tracking-wider mb-2 truncate">${icon} ${r.league}</div>
      <div class="flex items-center justify-between gap-2">
        <div class="text-sm font-semibold flex-1 min-w-0">${r.home}<br><span class="text-ink-2">${r.away}</span></div>
        <div class="score font-num text-xl font-bold text-sea-700 ${spoiler?'spoiler-blur':''}" data-score="${r.score}">${spoiler?'0 : 0':r.score}</div>
      </div>
      <div class="text-[11px] text-ink-3 mt-2 font-num">${r.time}</div>
    </div>`;
}

function renderResults(){
  const box = document.getElementById('resultList');
  const hint = document.getElementById('resultHint');
  const list = RESULTS.filter(r => resSport==='all' || r.sport===resSport);

  if(!list.length){
    box.innerHTML = `<div class="bg-white rounded-xl shadow-card px-5 py-10 text-center text-ink-3 text-sm col-span-full">最近半个月没有已结束的比赛</div>`;
    if(hint) hint.textContent = '';
    document.getElementById('spoilerHint').classList.toggle('hidden', !spoiler);
    return;
  }

  // 按自然日分组：RESULTS 本身已按时间倒序，Map 的插入顺序即「日期倒序」
  const groups = new Map();
  for(const r of list){
    if(!groups.has(r.dateKey)) groups.set(r.dateKey, []);
    groups.get(r.dateKey).push(r);
  }

  box.innerHTML = [...groups.entries()].map(([key, items])=>{
    const head = items[0];
    const opened = expandedDays.has(key);
    const shown = opened ? items : items.slice(0, RESULT_PREVIEW);
    const rest = items.length - shown.length;
    const dayTag = head.diff===0 ? '<span class="text-[10px] font-bold text-ok">今天</span>'
                 : head.diff===-1 ? '<span class="text-[10px] font-bold text-sea-600">昨天</span>' : '';
    return `
    <div class="col-span-full">
      <div class="flex items-center gap-2.5 pt-2 pb-2">
        <span class="text-xs font-bold text-ink-1 font-num">${head.dayNum}</span>
        <span class="text-[11px] text-ink-3">周${head.wd}</span>
        ${dayTag}
        <div class="flex-1 h-px bg-sea-100"></div>
        <span class="text-[11px] text-ink-3 font-num">${items.length} 场</span>
      </div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${shown.map(resultCard).join('')}
        ${rest>0 ? `<button onclick="expandResults('${key}')" class="rounded-xl border border-dashed border-sea-200 text-sea-700 text-sm font-semibold py-4 px-4 hover:bg-sea-50 transition-colors">展开当日全部 ${items.length} 场<svg class="inline ml-1" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" data-page-node-id="expChev"><path d="M6 9l6 6 6-6"/></svg></button>` : ''}
        ${opened && items.length>RESULT_PREVIEW ? `<button onclick="collapseResults('${key}')" class="rounded-xl text-ink-3 text-xs font-semibold py-4 hover:text-ink-1 transition-colors">收起</button>` : ''}
      </div>
    </div>`;
  }).join('');

  if(hint) hint.textContent = `${groups.size} 天 · ${list.length} 场`;

  // 防剧透：比分区默认打码，点一下单独揭示（比分直接存在 data 属性里，不依赖数组下标）
  if(spoiler){
    box.querySelectorAll('.score').forEach(el=>{
      el.onclick = ()=>{ el.textContent = el.dataset.score; el.classList.remove('spoiler-blur'); };
    });
  }
  document.getElementById('spoilerHint').classList.toggle('hidden', !spoiler);
}

/* 赛果按天折叠：默认每组只露 6 场，避免 15 天 × N 场把页面拉成无底洞 */
function expandResults(key){ expandedDays.add(key); renderResults(); }
function collapseResults(key){ expandedDays.delete(key); renderResults(); }

/* ================= 提醒 ================= */
function toggleRemind(id){
  const m = MATCHES.find(x=>x.id===id);
  if (!m) return;
  m.remind = !m.remind;
  const label = vsPlain(m);      // 羽毛球可能没有对手（抽签未出）
  toast(m.remind ? `已设置提醒 · ${label}，开赛前 30 分钟通知你（附直播链接）`
                 : `已取消提醒 · ${label}`, m.remind);
  renderMatches(); updateFollowCount();
  saveFollow(id, m.remind);          // 存进数据库，刷新页面也还在
}
function updateFollowCount(){
  const n = MATCHES.filter(m=>m.remind||m.followed).length;
  document.getElementById('followCount').textContent = n;
}

/* ================= 赛前情报卡 ================= */
function openModal(id){
  const m = MATCHES.find(x=>x.id===id);
  const info = m.info;
  const watchUrl = (m.channels.find(c => c.url) || {}).url || null;   // 有网址才给「去观赛」按钮
  // 免费数据源没有情报数据，优雅降级而不是报错
  const infoBlock = info ? `
      <div class="mt-5 bg-sea-50 rounded-xl p-4">
        <div class="text-xs font-bold text-sea-700 mb-2">赛前情报卡</div>
        ${info.form?.length?`<div class="text-sm text-ink-2 space-y-1">${info.form.map(f=>`<div>· ${f}</div>`).join('')}</div>`:''}
        <div class="text-sm text-ink-2 mt-1">· 交锋记录：${info.h2h||'—'}</div>
        ${info.note?`<div class="text-sm text-ink-1 mt-2 leading-relaxed">${info.note}</div>`:''}
      </div>`
    : `<div class="mt-5 bg-sea-50 rounded-xl p-4 text-sm text-ink-3">
         · 该场次暂无赛前情报数据（阵容 / 伤停需接入付费数据源）
       </div>`;
  document.getElementById('modalPanel').innerHTML = `
    <div class="p-6">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-[11px] font-bold text-ink-3 tracking-wider">${GAME_ICON[m.game] || SPORT_ICON[m.sport]} ${m.league}</div>
          <h3 class="text-xl font-bold mt-1">${vsText(m)}</h3>
          <div class="text-sm text-sea-700 font-num font-bold mt-1">${m.dateLabel||DAY_LABEL[m.day]} ${m.time==='待定'?'开赛时间待定':m.time+' 开赛'}${m.bo?` · ${m.bo}`:''}${m.pending&&m.stage?` · ${m.stage}`:''}</div>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-sea-50 hover:bg-sea-100 flex items-center justify-center text-ink-2 flex-shrink-0">✕</button>
      </div>
      <div class="flex gap-1.5 mt-4 flex-wrap">${chBadges(m.channels)||'<span class="text-xs text-ink-3">暂无渠道信息</span>'}</div>
      ${infoBlock}

      <div class="flex gap-3 mt-5">
        <button onclick="toggleRemind('${m.id}');closeModal()"
          class="flex-1 ${m.remind?'bg-sea-100 text-sea-700':'bg-daisy hover:bg-daisy-hover text-[#5C4400]'} font-semibold text-sm py-3 rounded-full transition-colors">
          ${m.remind?'已设置提醒 · 点击取消':'开赛前 30 分钟提醒我'}
        </button>
        ${watchUrl
          ? `<a href="${watchUrl}" target="_blank" rel="noopener"
              class="flex-1 bg-sea-500 hover:bg-sea-600 text-white font-semibold text-sm py-3 rounded-full text-center transition-colors">去观赛 ↗</a>`
          : `<a href="javascript:void(0)" onclick="toast('这场暂时没有可跳转的观看入口',false)"
              class="flex-1 bg-sea-100 text-sea-700 font-semibold text-sm py-3 rounded-full text-center transition-colors">暂无观看入口</a>`}
      </div>
    </div>`;
  const md = document.getElementById('modal');
  md.classList.remove('hidden'); md.classList.add('flex');
  document.body.style.overflow='hidden';
}
function closeModal(){
  const md = document.getElementById('modal');
  md.classList.add('hidden'); md.classList.remove('flex');
  document.body.style.overflow='';
}

/* ================= Toast ================= */
function toast(msg, good=true){
  const t = document.createElement('div');
  t.className = `toast flex items-center gap-2 bg-deep-900 text-white text-sm px-5 py-3 rounded-full shadow-pop`;
  t.innerHTML = `<span class="w-2 h-2 rounded-full ${good?'bg-daisy':'bg-sea-300'}"></span>${msg}`;
  document.getElementById('toastBox').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320);},2600);
}

/* ================= 最近一场倒计时 ================= */
function tick(){
  const now = new Date();
  const next = MATCHES.filter(m=>m.dt>now).sort((a,b)=>a.dt-b.dt)[0];
  const tEl = document.getElementById('cdTime'), nEl = document.getElementById('cdTitle');
  if(!next){
    nEl.textContent = MATCHES.length ? '近期赛事已播完' : '暂无赛程数据';
    tEl.textContent = '--:--:--';
    return;
  }
  nEl.textContent = `最近一场 · ${vsPlain(next)}`;
  let s = Math.max(0, Math.floor((next.dt-now)/1000));
  const h = String(Math.floor(s/3600)).padStart(2,'0'), m2 = String(Math.floor(s%3600/60)).padStart(2,'0'), ss = String(s%60).padStart(2,'0');
  tEl.textContent = `${h}:${m2}:${ss}`;
}

/* ================= 项目筛选 ================= */
document.querySelectorAll('.sport-tab').forEach(b=>{
  b.onclick = ()=>{
    curSport = b.dataset.sport;
    document.querySelectorAll('.sport-tab').forEach(x=>{
      const on = x===b;
      x.className = `tab-btn sport-tab whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold ${on?'bg-deep-900 text-white':'bg-sea-50 text-sea-700 hover:bg-sea-100'}`;
    });
    renderMatches();
  };
});

/* ================= 赛果项目筛选 ================= */
document.querySelectorAll('.rsport-tab').forEach(b=>{
  b.onclick = ()=>{
    resSport = b.dataset.rsport;
    document.querySelectorAll('.rsport-tab').forEach(x=>{
      const on = x===b;
      x.className = `tab-btn rsport-tab px-3 py-1.5 rounded-full text-xs font-semibold ${on?'bg-deep-900 text-white':'bg-sea-50 text-sea-700 hover:bg-sea-100'}`;
    });
    expandedDays.clear();                 // 换了筛选条件就回到默认折叠态
    renderResults();
  };
});

/* ================= 回到今天 ================= */
document.getElementById('backToday').onclick = ()=>{
  curDay = 0;
  renderDateStrip(); renderMatches();
  document.getElementById('dateStrip').scrollIntoView({behavior:'smooth', block:'nearest'});
};

/* ================= 防剧透开关 ================= */
document.getElementById('spoilerSwitch').onclick = ()=>{
  spoiler = !spoiler;
  const sw = document.getElementById('spoilerSwitch'), knob = document.getElementById('spoilerKnob');
  sw.className = `w-10 h-5 rounded-full relative transition-colors cursor-pointer ${spoiler?'bg-daisy':'bg-sea-200'}`;
  knob.style.left = spoiler ? '22px' : '2px';
  toast(spoiler?'防剧透已开启：比分默认隐藏，点击单独查看':'防剧透已关闭', spoiler);
  renderResults();
};
document.getElementById('followBtn').onclick = ()=>{
  const fs = MATCHES.filter(m=>m.remind||m.followed);
  if(!fs.length) return toast('还没有关注任何比赛或设置提醒', false);
  toast(`已关注 ${fs.length} 场：` + fs.slice(0,3).map(vsPlain).join('、') + (fs.length>3?' 等':''), true);
};

/* ================= 接口诊断横幅 =================
   连不上后端、或后端数据库里还没数据时，把原因和「怎么修」写出来，
   免得只看到一个空页面还不知道为什么。 */
function renderApiDiag(){
  const el = document.getElementById('apiDiag');
  if (!el) return;

  // 后端读到了数据 → 一切正常，不用提示
  if (LAST_STATUS === 200 && MATCHES.length > 0){
    el.classList.add('hidden'); el.innerHTML = ''; return;
  }

  const s = LAST_STATUS;
  let kind, why, fix;
  if (s === 0){
    kind = '连不上后端';
    why = LAST_ERR || '请求没能发出去';
    fix = '确认后端在运行：在项目目录执行 node backend/server.js，然后访问 http://localhost:8787/。';
  } else if (s === 404){
    kind = '接口地址不对（HTTP 404）';
    why = '后端没有 /api/matches 这个地址。';
    fix = '确认打开的是自己后端发的页面（http://localhost:8787/），而不是别的旧地址。';
  } else if (s >= 500){
    kind = `后端出错（HTTP ${s}）`;
    why = '后端在运行，但这次处理请求时报错了。';
    fix = '看运行后端那个窗口里打印的报错信息。';
  } else if (s === 200){
    kind = '后端在跑，但数据库里还没有比赛';
    why = '多半是还没配数据源 Key，或者第一次抓取还没跑完。';
    fix = '把 backend/.env.example 复制成 backend/.env 填上 Key，再重启后端；也可打开 /api/selfcheck 看 missing_keys。';
  } else {
    kind = `接口异常（HTTP ${s}）`;
    why = LAST_ERR || '';
    fix = '打开 /api/selfcheck 看看后端状态。';
  }

  el.classList.remove('hidden');
  el.innerHTML =
    `<div class="font-bold text-deep-900 mb-1">⚠️ 实时数据未接入 · ${kind}</div>` +
    `<div class="text-ink-2">${why}</div>` +
    `<div class="mt-1 text-ink-3">怎么修：${fix}</div>` +
    `<div class="mt-2 flex flex-wrap gap-3 text-[11px]">` +
      `<a class="underline font-semibold" href="${API_BASE}/api/matches" target="_blank" rel="noopener">打开 /api/matches</a>` +
      `<a class="underline font-semibold" href="${API_BASE}/api/selfcheck" target="_blank" rel="noopener">打开 /api/selfcheck</a>` +
      `<a class="underline font-semibold" href="javascript:location.reload()">重新加载</a>` +
    `</div>`;
}

/* ================= 初始化 ================= */
(async function init(){
  renderDateStrip();
  await loadMatches();                   // 先取数（赛程 + 赛果，都来自后端数据库）
  await loadFollows();                   // 再把后端存过的提醒状态贴回列表
  labelMatches();
  renderDateStrip();                     // 拿到真实数据后刷新日期条上的「每天几场」
  const badge = document.getElementById('srcBadge');
  if (badge) {
    const ok = LAST_STATUS === 200;
    badge.textContent = ok
      ? `数据库 · 未来 15 天 ${MATCHES.length} 场 · 赛果 ${RESULTS.length} 场 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 更新${API_BUILD ? ` · ${API_BUILD}` : ''}`
      : `后端未连接 · ${LAST_STATUS || '无响应'}${LAST_ERR ? `（${LAST_ERR}）` : ''}`;
    badge.className = `text-[11px] font-semibold px-2.5 py-1 rounded-full backdrop-blur ${ok?'bg-white/70 text-deep-800':'bg-daisy-soft text-[#7A5B00]'}`;
  }
  renderApiDiag();                       // 接口失败时把确切原因显示出来
  renderResults();                       // 用后端返回的赛果重绘
  renderMatches(); updateFollowCount(); tick();
  setInterval(tick, 1000);
  // 页面可见时自动刷新赛程（切回标签页不会看到过期数据）
  document.addEventListener('visibilitychange', async ()=>{
    if(!document.hidden){
      await loadMatches(); await loadFollows(); labelMatches(); renderDateStrip(); renderMatches(); renderResults(); renderApiDiag(); updateFollowCount();
    }
  });
})();
</script>
</body>
</html>
